[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Laboratorio de confiabilidad para un agente LangGraph que gestiona proyectos mediante tools MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.7.4,<2",
    "langgraph>=1.2.19,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
live = [
    "langchain-groq>=1.1.3,<2",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "langchain-groq>=1.1.3,<2",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.1,<2",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arl"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
